name: Publish Release and GHCR (manual)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example, v0.1.0)'
        required: true
        type: string
      publish_latest:
        description: 'Also update the stable GHCR latest tag and mark this Release as latest'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the requested release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Resolve version and commit
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || (( ${#RELEASE_TAG} > 120 )); then
            echo "::error::Use a version tag such as v0.1.0 or v0.1.0-rc.1 (at most 120 characters)."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::The requested tag does not exist. Create and push it only after the owner authorizes a release."
            exit 1
          fi
          SHA=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          PRERELEASE=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            PRERELEASE=true
          fi
          if [[ "$PRERELEASE" == true && "$PUBLISH_LATEST" == true ]]; then
            echo "::error::A prerelease cannot update latest."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux release (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      ARCH: ${{ matrix.arch }}
      CGO_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Bun from npm
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/bun" --no-audit --no-fund bun@1.4.4
          echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"
          [[ "$("$RUNNER_TEMP/bun/node_modules/.bin/bun" --version)" == '1.4.4' ]] || { echo '::error::Unexpected Bun version'; exit 1; }
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Linux backend
        run: |
          go mod download
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o "new-api-linux-$ARCH-$VERSION"
      - name: Generate checksums
        run: sha256sum "new-api-linux-$ARCH-$VERSION" > "checksums-linux-$ARCH.txt"

      - name: Upload Linux release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            new-api-linux-${{ matrix.arch }}-*
            checksums-linux-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7

  ghcr:
    name: Publish GHCR image
    needs: [prepare, linux]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-build.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      sha: ${{ needs.prepare.outputs.sha }}
      publish_latest: ${{ inputs.publish_latest }}

  publish:
    name: Publish GitHub Release
    needs: [prepare, ghcr]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the existing release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Verify the release tag still points to the prepared commit
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo '::error::The release tag changed after preparation.'; exit 1; }
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Write image reference
        env:
          IMAGE: ${{ needs.ghcr.outputs.image }}
          DIGEST: ${{ needs.ghcr.outputs.digest }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          printf '%s:%s\n%s@%s\n' "$IMAGE" "$RELEASE_TAG" "$IMAGE" "$DIGEST" > release-files/container-image.txt
          {
            printf 'Source commit: `%s`\n\n' "$RELEASE_SHA"
            printf 'GHCR image: `%s:%s`\n\n' "$IMAGE" "$RELEASE_TAG"
            printf 'Pinned image: `%s@%s`\n' "$IMAGE" "$DIGEST"
          } > release-notes.md
      - name: Publish release and assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ inputs.publish_latest && 'true' || 'false' }}
          fail_on_unmatched_files: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

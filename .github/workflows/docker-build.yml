name: Publish GHCR image (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag approved for this manual release
        required: true
        type: string
      sha:
        description: Full commit SHA resolved by the manual release workflow
        required: true
        type: string
      publish_latest:
        description: Also update latest for a stable version
        required: false
        default: false
        type: boolean
    outputs:
      image:
        description: GHCR image repository
        value: ${{ jobs.create_manifests.outputs.image }}
      digest:
        description: Published multi-architecture image digest
        value: ${{ jobs.create_manifests.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build_single_arch:
    name: Build GHCR image (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Prepare image version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,121}$ ]] || { echo '::error::Invalid image version tag'; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected a full commit SHA'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo '::error::Checkout does not match release commit'; exit 1; }
          if [[ "$PUBLISH_LATEST" == true && "$RELEASE_TAG" == *-* ]]; then
            echo '::error::A prerelease cannot update latest'
            exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          printf '%s\n' "$RELEASE_TAG" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Save architecture digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/ghcr-digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/ghcr-digests/digest-$ARCH.txt"

      - name: Upload architecture digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/ghcr-digests/digest-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign architecture image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$IMAGE_DIGEST"

  create_manifests:
    name: Publish GHCR multi-architecture manifest
    needs: build_single_arch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.manifest.outputs.image }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ghcr-digest-*
          path: ${{ runner.temp }}/ghcr-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version manifest
        id: manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SOURCES=()
          for ARCH in amd64 arm64; do
            DIGEST=$(cat "$RUNNER_TEMP/ghcr-digests/digest-$ARCH.txt")
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid $ARCH image digest"; exit 1; }
            SOURCES+=("$IMAGE@$DIGEST")
          done
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "${SOURCES[@]}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{.Manifest.Digest}}')
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Invalid multi-architecture digest'; exit 1; }
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update latest when explicitly requested
        if: inputs.publish_latest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE: ${{ steps.manifest.outputs.image }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" != *-* ]] || { echo '::error::A prerelease cannot update latest'; exit 1; }
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$IMAGE_DIGEST"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign multi-architecture image
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$IMAGE_DIGEST"

      - name: Write image summary
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE: ${{ steps.manifest.outputs.image }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo '### Published GHCR image'
            echo "Version: \`$IMAGE:$RELEASE_TAG\`"
            echo "Digest: \`$IMAGE@$IMAGE_DIGEST\`"
            echo 'Platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"

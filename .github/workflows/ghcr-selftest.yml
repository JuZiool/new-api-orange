name: GHCR Write Self Test

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scratch image
        run: |
          docker pull alpine:3.20
          docker tag alpine:3.20 ghcr.io/juziool/newapi-orange-selftest:test
          docker push ghcr.io/juziool/newapi-orange-selftest:test

      - name: Probe real package name
        run: |
          docker tag alpine:3.20 ghcr.io/juziool/new-api-orange:selftest-probe
          docker push ghcr.io/juziool/new-api-orange:selftest-probe
